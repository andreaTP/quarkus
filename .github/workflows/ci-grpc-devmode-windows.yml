name: gRPC Dev Mode Windows Test

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_OPTS: -Xmx3g -XX:MaxMetaspaceSize=1g
  COMMON_MAVEN_ARGS: -e -B --settings .github/mvn-settings.xml --fail-at-end -Dno-format

jobs:
  grpc-devmode-windows:
    name: gRPC DevMode Tests - Windows
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Support longpaths on Windows
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 17
      - name: Quick build
        run: ./mvnw ${{ env.COMMON_MAVEN_ARGS }} -Dquickly -T1C
      - name: Run GrpcDevModeTest (Windows)
        shell: bash
        run: |
          ./mvnw $COMMON_MAVEN_ARGS verify -f extensions/grpc/deployment \
            -Dtest="GrpcDevModeTest#testProtoFileChangeReload+testProtoFileChangeAndImplementationReload" \
            -Dsurefire.rerunFailingTestsCount=0
